name: Update fairs and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh official fair data
        run: npm run crawl:fairs
        continue-on-error: true

      - name: Save verified data changes
        run: |
          if ! git diff --quiet -- app/fairs.generated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/fairs.generated.json
            git commit -m "chore: refresh fair schedule [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages path
        run: echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
