name: Update fairs and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
    # 매년 10월 1일 06:15 KST: 다음 해 전체 일정 전수 점검
    - cron: "15 21 30 9 *"
  workflow_dispatch:
    inputs:
      full_audit:
        description: "다음 해 전체 일정 전수 점검 실행"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh official fair data
        run: npm run crawl:fairs
        env:
          FULL_AUDIT: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 21 30 9 *') || inputs.full_audit }}
        continue-on-error: true

      - name: Save crawl result changes
        run: |
          if ! git diff --quiet -- app/fairs.generated.json app/crawl-report.generated.json app/annual-audit.generated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/fairs.generated.json app/crawl-report.generated.json app/annual-audit.generated.json
            git commit -m "chore: refresh fair crawl results [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages path
        run: echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"

      - name: Build static site
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
